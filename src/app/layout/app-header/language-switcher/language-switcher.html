<mat-menu class="language-switcher-panel" #languageMenu="matMenu" xPosition="before">
	@for (language of availableLanguages; track language) {
	<button
		class="language-switcher-item"
		[attr.aria-current]="language === languageService.language() ? 'true' : null"
		(click)="setLanguage(language)"
		type="button"
		mat-menu-item>
		<span class="language-switcher-item__emoji" aria-hidden="true">
			{{ languageFlags[language] }}
		</span>
		<span class="language-switcher-item__label">{{ languageFullNames[language] }}</span>
	</button>
	}
</mat-menu>
<button
	class="language-switcher"
	[matMenuTriggerFor]="languageMenu"
	[attr.aria-label]="
		('uni.change-language' | translate) + ': ' + languageFullNames[languageService.language()]
	"
	type="button"
	matRipple>
	<svg
		class="language-switcher__icon"
		xmlns="http://www.w3.org/2000/svg"
		height="24px"
		viewBox="0 -960 960 960"
		width="24px"
		fill="currentColor"
		aria-hidden="true"
		focusable="false">
		<path
			d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-7-.5-14.5T799-507q-5 29-27 48t-52 19h-80q-33 0-56.5-23.5T560-520v-40H400v-80q0-33 23.5-56.5T480-720h40q0-23 12.5-40.5T563-789q-20-5-40.5-8t-42.5-3q-134 0-227 93t-93 227h200q66 0 113 47t47 113v40H400v110q20 5 39.5 7.5T480-160Z" />
	</svg>
	<span class="language-switcher__text">{{ languageService.language() }}</span>
</button>
